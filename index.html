<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <div class="container-fluid mt-3">
    <h1>Mini tablero de ajedrez</h1>
    <div class="row">
      <div class="col p-4 bg-white text-dark">1</div>
      <div class="col p-4 bg-dark text-white">2</div>
      <div class="col p-4 bg-white text-dark">3</div>
      <div class="col p-4 bg-dark text-white">4</div>
    </div>
    <div class="row">
      <div class="col p-4 bg-dark text-white">5</div>
      <div class="col p-4 bg-white text-dark">6</div>
      <div class="col p-4 bg-dark text-white">7</div>
      <div class="col p-4 bg-white text-dark">8</div>
    </div>    
    <div class="row">
      <div class="col p-4 bg-white text-dark">9</div>
      <div class="col p-4 bg-dark text-white">10</div>
      <div class="col p-4 bg-white text-dark">11</div>
      <div class="col p-4 bg-dark text-white">12</div>
    </div>
    <div class="row">
      <div class="col p-4 bg-dark text-white">13</div>
      <div class="col p-4 bg-white text-dark">14</div>
      <div class="col p-4 bg-dark text-white">15</div>
      <div class="col p-4 bg-white text-dark">16</div>
    </div>
  </div>
</body>
</html>
